name: create-ontrack-lti-deployment
on:
  push:
    tags:
      - 'v*'
    # branches:
    #   - '*.x'
    #   - 'development'
    #   - 'main'
  # deployment:
  # workflow_dispatch:
jobs:
  docker-lti-server:
    if: github.repository_owner == 'doubtfire-lms'
    environment: deployment-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup meta for LTI server
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ontrack-lti
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern=prod-{{version}}
            type=semver,pattern=prod-{{major}}.{{minor}}
            type=semver,pattern=prod-{{major}}
      - name: Build and push LTI server
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
